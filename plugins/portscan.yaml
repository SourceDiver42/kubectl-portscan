apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: portscan
spec:
  version: v0.1.0
  homepage: https://github.com/SourceDiver42/kubectl-portscan
  shortDescription: Run nmap from inside the cluster
  description: |
    Runs nmap in an ephemeral pod, optionally pinned to a node and/or on the
    host network, so you can test firewalls and exposed ports on nodes without
    shell access (e.g. Talos). Each run creates a throwaway namespace labelled
    pod-security.kubernetes.io/enforce=privileged and deletes it afterwards.
  caveats: |
    Creates a privileged namespace and a pod with NET_RAW/NET_ADMIN (or none
    with --scan-type connect). Requires RBAC to create namespaces and pods.
    Also available as `kubectl nmap` (separate plugin entry, same binary).
  platforms:
  - selector:
      matchLabels: {os: linux, arch: amd64}
    uri: https://github.com/SourceDiver42/kubectl-portscan/releases/download/v0.1.0/kubectl-portscan_linux_amd64.tar.gz
    sha256: 67712f8386e29c87fa752b45ea2a1bfbb9696738dffff13fd461f1ab5f520407
    bin: kubectl-portscan
  - selector:
      matchLabels: {os: linux, arch: arm64}
    uri: https://github.com/SourceDiver42/kubectl-portscan/releases/download/v0.1.0/kubectl-portscan_linux_arm64.tar.gz
    sha256: a6a63f31f89fe0562b23606c2208aa9bfa2b83a27ca7fe353540628a0b5662f3
    bin: kubectl-portscan
  - selector:
      matchLabels: {os: darwin, arch: arm64}
    uri: https://github.com/SourceDiver42/kubectl-portscan/releases/download/v0.1.0/kubectl-portscan_darwin_arm64.tar.gz
    sha256: 30a57774398861151e63ad075a39b22d1d4634e8e7229b6095add707bc96c16a
    bin: kubectl-portscan
