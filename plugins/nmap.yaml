apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: nmap
spec:
  version: v0.1.0
  homepage: https://github.com/SourceDiver42/kubectl-portscan
  shortDescription: Run nmap from inside the cluster
  description: |
    Runs nmap in an ephemeral pod, optionally pinned to a node and/or on the
    host network, so you can test firewalls and exposed ports on nodes without
    shell access (e.g. Talos). Each run creates a throwaway namespace labelled
    pod-security.kubernetes.io/enforce=privileged and deletes it afterwards.
  caveats: |
    Creates a privileged namespace and a pod with NET_RAW/NET_ADMIN (or none
    with --scan-type connect). Requires RBAC to create namespaces and pods.
    Also available as `kubectl portscan` (separate plugin entry, same binary).
  platforms:
  - selector:
      matchLabels: {os: linux, arch: amd64}
    uri: https://github.com/SourceDiver42/kubectl-portscan/releases/download/v0.1.0/kubectl-nmap_linux_amd64.tar.gz
    sha256: 71f8ec249f4978324728f4656f895f755304ad45a6a229c28963b392b07375f0
    bin: kubectl-nmap
  - selector:
      matchLabels: {os: linux, arch: arm64}
    uri: https://github.com/SourceDiver42/kubectl-portscan/releases/download/v0.1.0/kubectl-nmap_linux_arm64.tar.gz
    sha256: c570542e1259506d7f2292f0a150c63b0cef26ab2b69122c5851204fda08b518
    bin: kubectl-nmap
  - selector:
      matchLabels: {os: darwin, arch: arm64}
    uri: https://github.com/SourceDiver42/kubectl-portscan/releases/download/v0.1.0/kubectl-nmap_darwin_arm64.tar.gz
    sha256: c863b8a7ee8b30ba0d31fb981d4dfe3d6e1ac080f9be26dae81cb33e8d284168
    bin: kubectl-nmap
