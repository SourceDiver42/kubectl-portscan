name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build archives
      run: bash scripts/dist.sh

    - name: Render krew manifests with release checksums
      run: bash scripts/render-krew.sh "${GITHUB_REF_NAME}"

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          dist/*.tar.gz
          dist/checksums.txt
          krew/portscan.yaml
          krew/nmap.yaml
